{% extends 'base.html' %}

{% block content %}

<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px); /* Accounts for navbar height */
        padding: 40px 20px;
    }

    .glass-login-card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 4px solid #00d4ff;
        padding: 40px;
        border-radius: 16px;
        backdrop-filter: blur(20px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    .glass-input {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        font-family: inherit;
        margin-bottom: 20px;
    }

    .glass-input:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
    }

    .glass-input::placeholder {
        color: #64748b;
    }

    .input-label {
        display: block;
        font-size: 13px;
        color: #a0aec0;
        font-weight: 600;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .neon-login-btn {
        background: linear-gradient(90deg, #00d4ff, #00ffcc);
        border: none;
        color: #0a0f2c;
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        width: 100%;
        margin-top: 10px;
    }

    .neon-login-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 212, 255, 0.5);
    }

    /* Styled Error Messages */
    .glass-alert {
        background: rgba(255, 77, 77, 0.1);
        border: 1px solid rgba(255, 77, 77, 0.4);
        color: #ffb3b3;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 25px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .register-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: #a0aec0;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .register-link:hover {
        color: #00d4ff;
    }
    .register-link span {
        color: #00d4ff;
        font-weight: 600;
    }
</style>

<div class="login-wrapper">
    <div class="glass-login-card">
        
        <div style="position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: rgba(0, 212, 255, 0.1); filter: blur(50px); border-radius: 50%; pointer-events: none;"></div>

        <div style="text-align: center; margin-bottom: 35px;">
            <div style="width: 64px; height: 64px; background: rgba(0, 212, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; border: 1px solid rgba(0, 212, 255, 0.3);">
                <span style="font-size: 28px;">🔐</span>
            </div>
            <h2 style="font-size: 28px; font-weight: 800; margin: 0 0 5px 0; color: #fff;">
                Welcome Back
            </h2>
            <p style="color: #a0aec0; font-size: 14px; margin: 0;">Sign in to access your portal</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="glass-alert">
                    <span>⚠️</span> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div>
                <label class="input-label">Username</label>
                <input type="text" name="username" class="glass-input" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div>
                <label class="input-label">Password</label>
                <input type="password" name="password" class="glass-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="neon-login-btn">
                Log In securely
            </button>
        </form>

        <a href="/accounts/register" class="register-link">
            Don't have an account? <span>Register here</span>
        </a>

    </div>
</div>

{% endblock %}
