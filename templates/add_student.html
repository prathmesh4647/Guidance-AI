{% extends "base.html" %} 

{% block content %}

<style>
    /* Styling for the select dropdown */
    .glass-select {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        font-family: inherit;
        appearance: none; /* Removes default browser styling */
        -webkit-appearance: none;
        -moz-appearance: none;
        cursor: pointer;
        /* Custom dropdown arrow */
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d4ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 16px;
    }
    .glass-select:focus {
        border-color: #00ffcc;
        box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        background-color: rgba(0, 0, 0, 0.3);
    }
    /* Style the dropdown options (browser support varies, but helps in Chrome/Edge) */
    .glass-select option {
        background-color: #1a1f4a;
        color: white;
        padding: 10px;
    }
    
    .neon-submit-btn {
        background: linear-gradient(90deg, #00d4ff, #00ffcc);
        border: none;
        color: #0a0f2c;
        padding: 14px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        width: 100%;
        margin-top: 15px;
    }
    .neon-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5);
    }
    .secondary-back-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #cbd5e1;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        margin-top: 15px;
    }
    .secondary-back-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border-color: rgba(255, 255, 255, 0.4);
    }
</style>

<div style="
    min-height: 100vh;
    padding: 80px 20px;
    background: linear-gradient(135deg, #0a0f2c, #1a1f4a, #2c1a4a);
    color: white;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
">

    <div style="
        width: 100%;
        max-width: 480px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 16px;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        margin-top: 40px;
    ">

        <header style="text-align: center; margin-bottom: 30px;">
            <h2 style="
                font-size: 26px;
                font-weight: 800;
                margin-top: 0;
                margin-bottom: 10px;
                color: #00ffcc;
                text-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            ">
                ➕ Add Student
            </h2>
            <p style="color: #a0aec0; font-size: 15px; margin: 0;">
                Adding a new member to <strong style="color: #fff;">{{ team.name }}</strong>.
            </p>
        </header>

        {% if error %}
        <div style="
            background: rgba(255, 77, 77, 0.1);
            border-left: 4px solid #ff4d4d;
            padding: 12px 15px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 25px;
            color: #ff4d4d;
            font-weight: 600;
            font-size: 14px;
        ">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" style="margin-bottom: 20px;">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; color: #a0aec0; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Select Unassigned Student <span style="color: #00ffcc;">*</span>
                </label>
                
                <select name="student_id" class="glass-select" required>
                    <option value="" disabled selected style="color: #64748b;">-- Choose a student --</option>
                    
                    {% for student in students %}
                        {% if not student.student_teams.exists %}
                            <option value="{{ student.id }}">
                                {{ student.first_name }} {{ student.last_name }} ({{ student.username }})
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
                <p style="font-size: 12px; color: #64748b; margin-top: 8px;">Only students without an active team are shown.</p>
            </div>

            <button type="submit" class="neon-submit-btn">
                ✅ Add to Team
            </button>
        </form>

        <a href="{% url 'manage_teams' %}" style="text-decoration: none;">
            <button class="secondary-back-btn">⬅️ Cancel & Go Back</button>
        </a>

    </div>
</div>

{% endblock %}
