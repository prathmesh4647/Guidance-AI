{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        {% block title %}Guidance.AI{% endblock %} | Guidance.AI
    </title>
    
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/base_style.css' %}" />

    <style>
        /* =========================================
           GLOBAL THEME STYLES (Guidance.AI)
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f2c, #1a1f4a, #2c1a4a);
            background-attachment: fixed; /* Keeps the gradient stable when scrolling */
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* =========================================
           GLASSMORPHISM NAVBAR
           ========================================= */
        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: rgba(10, 15, 44, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        /* Logo Area */
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }
        .nav-brand img {
            height: 35px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.5));
        }

        /* Nav Links */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
            align-items: center;
        }
        .nav-links li {
            position: relative;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 8px 0;
        }
        .nav-links a:hover {
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        /* =========================================
           MODERN DROPDOWN MENU
           ========================================= */
        .nav-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 20px;
            background: rgba(10, 15, 44, 0.95);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            list-style: none;
            padding: 10px 0;
            min-width: 220px;
            
            /* Hidden by default with smooth animation */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Show dropdown on hover */
        .nav-dropdown:hover .nav-dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-dropdown-menu li {
            padding: 0;
        }
        .nav-dropdown-menu a {
            display: block;
            padding: 12px 25px;
            color: #e2e8f0;
            font-weight: 500;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .nav-dropdown-menu a:hover {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-left: 3px solid #00d4ff;
            padding-left: 30px; /* Cool indentation effect on hover */
        }

        /* Responsive Navbar */
        @media (max-width: 768px) {
            .glass-nav { padding: 15px 20px; }
            .nav-links { gap: 15px; }
            .nav-links a { font-size: 14px; }
        }
    </style>
</head>

<body>

    <nav class="glass-nav">
        <a href="/" class="nav-brand">
            <img src="{% static 'images/skills.png' %}" alt="Guidance.AI Logo">
            Guidance.AI
        </a>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="{% url 'showcase' %}">Project Showcase</a></li>
            <li><a href="{% url 'leaderboard' %}">Leaderboard</a></li>
            
            <li class="nav-dropdown">
                <a href="#" style="display: flex; align-items: center; gap: 5px;">
                    Login 
                    <span style="font-size: 10px;">▼</span>
                </a>
                <ul class="nav-dropdown-menu">
                    <li><a href="/accounts">Login Portal</a></li>
                    <li><a href="/accounts/register">Student Registration</a></li>
                </ul>
            </li>
            
            <li><a href="/about">About Us</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
        {% block view %}{% endblock %}
    </main>

</body>
</html>
