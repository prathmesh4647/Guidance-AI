{% extends "base.html" %}
{% block content %}

<style>

    /* Page Container */
    .idea-page {
        max-width: 1100px;
        margin: 60px auto;
        padding: 20px;
    }

    /* HERO SECTION */
    .idea-hero {
        background: linear-gradient(135deg, #5b3df5, #9333ea);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        color: white;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        margin-bottom: 50px;
    }

    .idea-hero h2 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .idea-hero p {
        font-size: 16px;
        opacity: 0.9;
    }

    /* FORM CARD */
    .form-container {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        margin-bottom: 50px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        color: #ffffff;
        font-weight: 500;
        display: block;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: white;
        font-size: 14px;
        outline: none;
        transition: 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border: 1px solid #8b5cf6;
        box-shadow: 0 0 10px rgba(139,92,246,0.6);
    }

    textarea {
        resize: none;
    }

    /* BUTTON */
    .generate-btn {
        display: inline-block;
        padding: 14px 30px;
        background: linear-gradient(135deg, #6d28d9, #9333ea);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .generate-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    /* IDEAS SECTION */
    .ideas-section {
        margin-top: 30px;
    }

    .ideas-title {
        color: white;
        font-size: 24px;
        margin-bottom: 25px;
    }

    /* IDEA CARD */
    .idea-card {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(20px);
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        margin-bottom: 30px;
        transition: 0.3s ease;
        color: white;
    }

    .idea-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .idea-title {
        font-size: 20px;
        font-weight: bold;
        color: #c084fc;
        margin-bottom: 15px;
    }

    .idea-content {
        white-space: pre-wrap;
        line-height: 1.7;
        font-size: 14px;
        opacity: 0.95;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .idea-hero h2 {
            font-size: 24px;
        }

        .form-container {
            padding: 25px;
        }
    }

</style>

<div class="idea-page">

    <!-- HERO -->
    <div class="idea-hero">
        <h2>🚀 AI Innovation Mentor</h2>
        <p>Generate unique, plagiarism-safe final year project ideas powered by AI.</p>
    </div>

    <!-- FORM -->
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Domain</label>
                <input type="text" name="domain" required>
            </div>

            <div class="form-group">
                <label>Industry</label>
                <input type="text" name="industry" required>
            </div>

            <div class="form-group">
                <label>Problem You Want To Solve</label>
                <textarea name="problem" rows="5" required></textarea>
            </div>

            <center>
                <button type="submit" class="generate-btn">
                    Generate Ideas
                </button>
            </center>

        </form>
    </div>

    <!-- RESULTS -->
    {% if ideas %}
    <div class="ideas-section">
        <div class="ideas-title">✨ Innovative Suggestions</div>

        {% for idea in ideas %}
        <div class="idea-card">
            <div class="idea-content">
                {{ idea }}
            </div>
        </div>
        {% endfor %}

    </div>
    {% endif %}

</div>

{% endblock %}
