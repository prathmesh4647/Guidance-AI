{% extends "base.html" %} 

{% block content %}

<style>
    .glass-input {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    .glass-input:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        background: rgba(0, 0, 0, 0.3);
    }
    .neon-submit-btn {
        background: linear-gradient(90deg, #00d4ff, #00ffcc);
        border: none;
        color: #0a0f2c;
        padding: 14px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        width: 100%;
        margin-top: 10px;
    }
    .neon-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
    }
    .secondary-back-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #cbd5e1;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        margin-top: 15px;
    }
    .secondary-back-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border-color: rgba(255, 255, 255, 0.4);
    }
</style>

<div style="
    min-height: 100vh;
    padding: 80px 20px;
    background: linear-gradient(135deg, #0a0f2c, #1a1f4a, #2c1a4a);
    color: white;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
">

    <div style="
        width: 100%;
        max-width: 450px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 16px;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        margin-top: 40px;
    ">

        <header style="text-align: center; margin-bottom: 30px;">
            <h2 style="
                font-size: 28px;
                font-weight: 800;
                margin-top: 0;
                margin-bottom: 10px;
                color: #00d4ff;
                text-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            ">
                ✏️ Edit Team
            </h2>
            <p style="color: #a0aec0; font-size: 14px; margin: 0;">
                Update your team's name and identity.
            </p>
        </header>

        {% if error %}
        <div style="
            background: rgba(255, 77, 77, 0.1);
            border-left: 4px solid #ff4d4d;
            padding: 12px 15px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 25px;
            color: #ff4d4d;
            font-weight: 600;
            font-size: 14px;
        ">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" style="margin-bottom: 20px;">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; color: #a0aec0; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Team Name <span style="color: #00d4ff;">*</span>
                </label>
                <input type="text" name="team_name" value="{{ team.name }}" class="glass-input" required placeholder="Enter team name...">
            </div>

            <button type="submit" class="neon-submit-btn">
                💾 Save Changes
            </button>
        </form>

        <a href="{% url 'manage_teams' %}" style="text-decoration: none;">
            <button class="secondary-back-btn">⬅️ Cancel & Go Back</button>
        </a>

    </div>
</div>

{% endblock %}
