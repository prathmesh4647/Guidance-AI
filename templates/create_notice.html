{% extends "base.html" %}

{% block content %}

<style>
    .glass-input {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    .glass-input:focus {
        border-color: #ffaa00;
        box-shadow: 0 0 12px rgba(255, 170, 0, 0.2);
        background: rgba(0, 0, 0, 0.3);
    }
    
    /* Customizing the multiple select box */
    .glass-select-multiple {
        height: 120px;
        resize: vertical;
    }
    .glass-select-multiple option {
        padding: 10px 15px;
        margin-bottom: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        color: #cbd5e1;
        cursor: pointer;
        transition: background 0.2s;
    }
    .glass-select-multiple option:hover {
        background: rgba(255, 255, 255, 0.1);
    }
    .glass-select-multiple option:checked {
        background: rgba(255, 170, 0, 0.2);
        color: #ffaa00;
        font-weight: bold;
        border-left: 3px solid #ffaa00;
    }

    .neon-submit-btn {
        background: linear-gradient(90deg, #ffaa00, #ff8800);
        border: none;
        color: #0a0f2c;
        padding: 14px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
        width: 100%;
        margin-top: 15px;
    }
    .neon-submit-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 170, 0, 0.5);
    }
    
    .secondary-back-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #cbd5e1;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        margin-top: 15px;
    }
    .secondary-back-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border-color: rgba(255, 255, 255, 0.4);
    }
</style>

<div style="
    min-height: 100vh;
    padding: 80px 20px;
    background: linear-gradient(135deg, #0a0f2c, #1a1f4a, #2c1a4a);
    color: white;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
">

    <div style="
        width: 100%;
        max-width: 600px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 16px;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        margin-top: 20px;
    ">

        <header style="text-align: center; margin-bottom: 30px;">
            <div style="
                width: 64px; 
                height: 64px; 
                background: rgba(255, 170, 0, 0.1); 
                border-radius: 50%; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                margin: 0 auto 15px auto; 
                border: 1px solid rgba(255, 170, 0, 0.3);
            ">
                <span style="font-size: 28px;">📢</span>
            </div>
            <h2 style="
                font-size: 28px;
                font-weight: 800;
                margin-top: 0;
                margin-bottom: 10px;
                color: #ffaa00;
                text-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
            ">
                Post an Announcement
            </h2>
            <p style="color: #a0aec0; font-size: 15px; margin: 0;">
                Broadcast important updates to your student teams.
            </p>
        </header>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; color: #a0aec0; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Notice Title <span style="color: #ffaa00;">*</span>
                </label>
                <input type="text" name="title" placeholder="e.g., Upcoming Project Deadline..." class="glass-input" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; color: #a0aec0; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Detailed Message <span style="color: #ffaa00;">*</span>
                </label>
                <textarea name="message" placeholder="Type your announcement here..." rows="5" class="glass-input" style="resize: vertical;" required></textarea>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 13px; color: #a0aec0; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">
                    Target Audience (Hold Ctrl/Cmd to select multiple) <br>
                    Don't Select any team to send notice to all teams
                </label>
                <select name="teams" class="glass-input glass-select-multiple" multiple>
                    {% for team in teams %}
                        <option value="{{ team.id }}">👥 {{ team.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="neon-submit-btn">
                📤 Publish Notice
            </button>
        </form>

        <div style="margin-top: 15px;">
            <a href="{% url 'faculty_dashboard' %}" style="text-decoration: none;">
                <button class="secondary-back-btn">⬅️ Back to Dashboard</button>
            </a>
        </div>

    </div>
</div>

{% endblock %}
