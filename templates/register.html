{% extends 'base.html' %}

{% block content %}

<style>
    .registration-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 120px);
        padding: 60px 20px;
    }

    .glass-register-card {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 4px solid #ff00cc;
        padding: 50px 40px;
        border-radius: 16px;
        backdrop-filter: blur(20px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    /* Form Grid Layout */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 25px;
    }

    /* Full width on small screens */
    @media (max-width: 600px) {
        .form-grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }
    }

    .input-group.full-width {
        grid-column: 1 / -1;
    }

    .glass-input {
        width: 100%;
        padding: 14px 18px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: white;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .glass-input:focus {
        border-color: #ff00cc;
        box-shadow: 0 0 15px rgba(255, 0, 204, 0.2);
        background: rgba(0, 0, 0, 0.4);
    }

    .glass-input::placeholder {
        color: #64748b;
    }

    .input-label {
        display: block;
        font-size: 13px;
        color: #a0aec0;
        font-weight: 600;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .neon-register-btn {
        background: linear-gradient(90deg, #ff00cc, #00d4ff);
        border: none;
        color: white;
        padding: 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 0, 204, 0.3);
        width: 100%;
        letter-spacing: 0.5px;
    }

    .neon-register-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 0, 204, 0.5);
    }

    /* Styled Error Messages */
    .glass-alert {
        background: rgba(255, 77, 77, 0.1);
        border: 1px solid rgba(255, 77, 77, 0.4);
        color: #ffb3b3;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 25px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .login-link {
        display: block;
        text-align: center;
        margin-top: 30px;
        color: #a0aec0;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    .login-link:hover {
        color: #ff00cc;
    }
    .login-link span {
        color: #ff00cc;
        font-weight: 600;
    }
</style>

<div class="registration-wrapper">
    <div class="glass-register-card">
        
        <div style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255, 0, 204, 0.1); filter: blur(50px); border-radius: 50%; pointer-events: none;"></div>

        <div style="text-align: center; margin-bottom: 40px;">
            <div style="width: 64px; height: 64px; background: rgba(255, 0, 204, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; border: 1px solid rgba(255, 0, 204, 0.3);">
                <span style="font-size: 28px;">🎓</span>
            </div>
            <h2 style="font-size: 28px; font-weight: 800; margin: 0 0 5px 0; color: #fff;">
                Student Registration
            </h2>
            <p style="color: #a0aec0; font-size: 14px; margin: 0;">Create your account to access the Guidance.AI portal</p>
        </div>

        {% if error %}
            <div class="glass-alert">
                <span>⚠️</span> {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-grid">
                
                <div class="input-group">
                    <label class="input-label">First Name</label>
                    <input type="text" name="first_name" class="glass-input" placeholder="e.g. John" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Last Name</label>
                    <input type="text" name="last_name" class="glass-input" placeholder="e.g. Doe" required>
                </div>

                <div class="input-group full-width">
                    <label class="input-label">Permanent Registration Number (PRN)</label>
                    <input type="text" name="username" class="glass-input" placeholder="Enter your official PRN" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <input type="email" name="email" class="glass-input" placeholder="student@example.com" 
                           pattern="^[\w\.-]+@[\w\.-]+\.\w+$" title="Enter a valid email format" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <input type="text" name="phone" class="glass-input" placeholder="10-digit number" 
                           pattern="[6-9]{1}[0-9]{9}" title="Enter a valid 10-digit Indian phone number" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" name="password" class="glass-input" placeholder="Min. 6 characters" 
                           minlength="6" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="glass-input" placeholder="Repeat password" 
                           minlength="6" required>
                </div>

            </div>

            <button type="submit" class="neon-register-btn">
                Complete Registration
            </button>
        </form>

        <a href="/accounts/" class="login-link">
            Already have an account? <span>Login here</span>
        </a>

    </div>
</div>

{% endblock %}
